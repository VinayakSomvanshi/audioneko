<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Anti-flashbang theme and dark mode setup -->
    <script>
      (function() {
        try {
          const storedMode = localStorage.getItem('audioneko-theme-mode') || localStorage.getItem('audioneko-theme');
          const isLight = storedMode === 'light';
          if (isLight) {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
          const storedPalette = localStorage.getItem('audioneko-theme-palette') || 'crimson';
          document.documentElement.setAttribute('data-theme', storedPalette);

          const bgMap = {
            crimson: { dark: '#101012', light: '#f8f8f9' },
            amber: { dark: '#16140e', light: '#f9f7f0' },
            amethyst: { dark: '#140f17', light: '#f9f6fa' },
            nordic: { dark: '#171b22', light: '#f3f6fa' },
            emerald: { dark: '#101512', light: '#f5f8f6' },
            rose: { dark: '#161113', light: '#f9f6f6' }
          };
          const colors = bgMap[storedPalette] || bgMap.crimson;
          const metaColor = isLight ? colors.light : colors.dark;
          const metaTag = document.querySelector('meta[name="theme-color"]');
          if (metaTag) metaTag.setAttribute('content', metaColor);
        } catch (_) {}
      })();
    </script>

    <!-- Auto-recovery for stale chunks or asset load failures after deployments -->
    <script>
      (function() {
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var url = target.src || target.href || '';
            if (url.includes('/assets/')) {
              var key = 'audioneko_asset_reload';
              var last = sessionStorage.getItem(key);
              var now = Date.now();
              if (!last || (now - parseInt(last, 10)) > 10000) {
                sessionStorage.setItem(key, String(now));
                window.location.reload();
              }
            }
          }
        }, true);
      })();
    </script>

    <title>audioneko</title>
    <meta name="description" content="Private audiobook streaming web app with 3-tier streaming pipeline and offline OPFS support." />
    
    <!-- Fonts: Inter & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#080505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="audioneko" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-bg text-text antialiased min-h-screen flex flex-col selection:bg-accent-bg selection:text-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
